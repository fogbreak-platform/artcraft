<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fogbreak Hub</title>
  <link data-trunk rel="rust" data-bin="fogbreak-hub" data-wasm-opt="z" data-weak-refs />
  <style>
    :root {
      --fg-bg: #111821;
      --fg-panel: #1A2431;
      --fg-accent: #087F9C;
      --fg-text: #EAF1F7;
      --fg-muted: #9DB0C2;
      --fg-bg-light: #F7FAFC;
      --fg-panel-light: #FFFFFF;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--fg-bg);
      color: var(--fg-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    html[data-theme="light"], html[data-theme="light"] body {
      background: var(--fg-bg-light);
      color: #111821;
    }
    #fogbreak_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #fogbreak_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--fg-muted);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      pointer-events: none;
    }
    #fogbreak_loading::before {
      content: "";
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 2px solid rgba(8, 127, 156, 0.25);
      border-top-color: var(--fg-accent);
      animation: fg-spin 0.85s linear infinite;
    }
    @keyframes fg-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas
    id="fogbreak_canvas"
    data-host="page"
    data-engine="fogbreak-hub"
    data-rpc-key="fogbreakHubHost"
    data-iframe="false"
  ></canvas>
  <script>
    (function () {
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (!Orig) return;
      var ctxs = [];
      function Wrapped(opts) {
        var c = new Orig(opts);
        ctxs.push(c);
        return c;
      }
      Wrapped.prototype = Orig.prototype;
      window.AudioContext = Wrapped;
      if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
      function resumeAll() {
        ctxs.forEach(function (c) {
          if (c.state === "suspended") {
            c.resume().catch(function () {});
          }
        });
      }
      ["pointerdown", "mousedown", "touchstart", "keydown"].forEach(function (ev) {
        window.addEventListener(ev, resumeAll, { capture: true });
      });
    })();
  </script>
  <div id="fogbreak_loading">Loading Fogbreak Hub&hellip;</div>
</body>
</html>
